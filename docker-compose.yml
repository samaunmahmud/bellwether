name: bellwether

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bellwether
      POSTGRES_PASSWORD: bellwether
      POSTGRES_DB: bellwether
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bellwether']
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # Catches briefing emails in dev (FR-4.3). Inbox: http://localhost:8125
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '1125:1025'
      - '8125:8025'

volumes:
  pgdata:
